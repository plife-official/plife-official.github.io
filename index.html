<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>풀라이프 — 식집사의 식물 성장 스토리 기록 앱</title>
<meta name="description" content="물주기 알림부터 성장 다이어리까지. 식물과 함께한 매일을 기록해요.">
<meta property="og:title" content="풀라이프 — 나만의 식물 일기">
<meta property="og:description" content="물주기 알림부터 성장 다이어리까지. 식물과 함께한 매일을 기록해요.">
<meta property="og:type" content="website">
<script>
  // 기기 감지 → 스토어 자동 이동. 데스크톱/기타는 아래 랜딩 노출.
  (function () {
    var ua = navigator.userAgent || '';
    var APP_STORE = 'https://apps.apple.com/kr/app/id6782400445';
    var PLAY_STORE = 'https://play.google.com/store/apps/details?id=com.plife.plife_app';
    // 인앱 브라우저(인스타/페북/스레드/카카오/네이버/라인)에서는 iOS 에서 App Store 를
    // 열 방법이 없다. apps.apple.com 이 모바일 UA 에 itms-appss:// 로 301 하는데, 인앱 WebView
    // 는 이 스킴을 다른 앱으로 넘기지 못한다 — 자동 이동이든 사용자 버튼 탭이든 똑같이 막힌다
    // (탭은 제스처지만 리다이렉트로 스킴에 도달하는 순간 끊긴다). 탈출 스킴
    // x-safari-https:// 와 instagram://extbrowser 도 인스타가 차단했다. 2026-08 실기기 확인:
    // 인앱에서는 무반응, '외부 브라우저에서 열기'로 Safari 로 나가면 정상 동작.
    // → 확실한 그 경로를 1급 안내로 올리고, 스킴이 통하는 기기를 위해 버튼 시도는 남긴다.
    var inApp = /Instagram|Threads|FBAN|FBAV|FB_IAB|KAKAOTALK|NAVER\(inapp|Line\/|DaumApps/i.test(ua);
    if (inApp) {
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      document.documentElement.className += isIOS ? ' inapp inapp-ios' : ' inapp';
      if (isIOS) {
        document.addEventListener('DOMContentLoaded', function () {
          var a = document.getElementById('ios-cta');
          if (!a) { return; }
          a.addEventListener('click', function (e) {
            e.preventDefault();
            // 1) 리다이렉트를 거치지 않는 스킴 직접 시도
            location.href = 'itms-appss://apps.apple.com/kr/app/id6782400445';
            // 2) 스킴이 막혀 화면이 그대로면 표준 HTTPS 링크로 재시도(Apple 권장 형식)
            setTimeout(function () {
              if (document.visibilityState === 'visible') { location.href = APP_STORE; }
            }, 700);
          });
        });
      }
      return;
    }
    if (/iPhone|iPad|iPod/i.test(ua)) { location.replace(APP_STORE); }
    else if (/Android/i.test(ua)) { location.replace(PLAY_STORE); }
  })();
</script>
<style>

  body {

  .logo-leaf-r { width: 17px; height: 24px; background: #A8C5B5; border-radius: 0 50% 0 50%; position: absolute; bottom: 25px; right: 2px; transform: rotate(15deg); }

  .badges { display: flex; flex-direction: column; gap: 12px; align-items: center; }

    background: #1A1A1A; color: #fff; transition: transform .15s, opacity .15s;
  }
  .badge:hover { transform: translateY(-2px); opacity: .92; }
  .badge svg { width: 22px; height: 22px; fill: currentColor; }
  .badge .t { text-align: left; line-height: 1.15; }
  .badge .s { font-size: 10px; opacity: .75; display: block; }
  .badge .b { font-size: 16px; font-weight: 700; }
  .foot { margin-top: 44px; font-size: 12px; color: #B5B5B0; }
  /* 인앱 브라우저에서만 노출되는 안내 (script 에서 html.inapp 부여).
     iOS 인앱은 이 경로만 확실히 동작하므로 버튼 위에서 한 번 더 강조한다. */
  .tip {
    display: none; margin: 0 0 24px; padding: 14px 16px; border-radius: 12px;
    background: #F0F4F1; font-size: 13px; color: #5C6B62; line-height: 1.7;
  }
  .tip b { color: #3D7A5E; font-weight: 700; }
  html.inapp .tip { display: block; }
  html.inapp-ios .tip {
    background: #E8F1EB; border: 1px solid #C5DBCE; color: #35513F; font-size: 13.5px;
  }
</style>

    </div>
    <div class="foot">© plife · 식물과 함께한 매일을 기록해요<br><a href="/delete-account/">계정 삭제 요청</a></div>
  </main>
